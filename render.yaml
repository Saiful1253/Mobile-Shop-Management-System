services:
  - type: web
    name: mobile-shop-management
    env: dotnet
    region: singapore
    plan: free
    branch: main
    buildCommand: dotnet publish src/MobileShopManagementSystem.Web/MobileShopManagementSystem.Web.csproj -c Release -o ./publish
    startCommand: dotnet ./publish/MobileShopManagementSystem.Web.dll
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: mobile-shop-db
          property: connectionString

  - type: postgres
    name: mobile-shop-db
    env: docker
    region: singapore
    plan: free
    databaseName: MobileShopDb
    user: saiful1253
