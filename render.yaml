services:
  - type: web
    name: mobile-shop-management
    env: docker
    region: singapore
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: mobile-shop-db
          property: connectionString

  - type: postgres
    name: mobile-shop-db
    env: docker
    region: singapore
    plan: free
    databaseName: MobileShopDb
    user: saiful1253
